<!-- home.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

    <!-- 타이틀을 layout에서 받기 위한 fragment -->
    <title th:fragment="title">Home</title>
    <STYLE>
        .modal {
            display: none; /* 기본적으로 숨김 */
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5); /* 반투명 검은 배경 */
        }

        /* 모달 박스 */
        .modal-content {
            background-color: #fff;
            margin: 15% auto;
            padding: 20px;
            border-radius: 8px;
            width: 300px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        /* 닫기 버튼 (X) */
        .close-btn {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close-btn:hover {
            color: black;
        }
    </STYLE>


<body>
<div th:fragment="content">

    <button type="button" id="openModalBtn">모달 열기</button>

    <div id="myModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h3>모달 제목</h3>
            <p th:text="'안녕하세요, ' + ${userName} + '님!'">사용자 이름이 표시될 영역</p>
            <p>이것은 Thymeleaf와 순수 JS로 만든 모달입니다.</p>
            <button type="button" id="confirmBtn">확인</button>
        </div>
    </div>
</div>


<h2>동적 모달 예제</h2>

<button type="button" onclick="openDynamicModal(1)">1번 유저 정보 보기</button>
<button type="button" onclick="openDynamicModal(2)">2번 유저 정보 보기</button>

<div id="modalContainer" class="modal"></div>


<div th:fragment="pageScripts">
    <script th:src="@{/js/pages/home.js}"></script>
</div>

</body>
</html>
