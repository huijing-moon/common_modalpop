<!-- 사용자 상세 정보 모달 -->
<div th:fragment="user-detail-modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 th:text="${user.name} + '님의 정보'">사용자 정보</h3>
            <button type="button" class="close-btn" onclick="Modal.close()">&times;</button>
        </div>
        <div class="modal-body">
            <div class="info-row">
                <span class="info-label">이메일</span>
                <span class="info-value" th:text="${user.email}">user@example.com</span>
            </div>
            <div class="info-row">
                <span class="info-label">가입일</span>
                <span class="info-value" th:text="${user.regDate}">2023-01-01</span>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" onclick="Modal.close()">닫기</button>
            <button type="button" class="btn btn-primary" onclick="Modal.close()">확인</button>
        </div>
    </div>
</div>

<!-- 폼 모달창 -->
<div th:fragment="formModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>사용자 추가</h3>
            <button type="button" class="close-btn" onclick="Modal.close()">&times;</button>
        </div>
        <form id="userForm">
            <div class="modal-body">
                <div class="form-group">
                    <label for="userName">이름</label>
                    <input type="text" id="userName" name="userName" placeholder="이름을 입력하세요" required>
                </div>
                <div class="form-group">
                    <label for="role">역할</label>
                    <select id="role" name="role">
                        <option value="USER">일반 사용자</option>
                        <option value="ADMIN">관리자</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="Modal.close()">취소</button>
                <button type="button" class="btn btn-success" onclick="Modal.saveUser()">저장하기</button>
            </div>
        </form>
    </div>
</div>

<!-- 로딩 모달창 -->
<div th:fragment="loadingModal">
    <div class="modal-content loading">
        <div class="spinner"></div>
        <p data-modal-message>로딩 중...</p>
    </div>
</div>

<!-- 체크 모달창 -->
<div th:fragment="checkModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>사용자 추가</h3>
            <button type="button" class="close-btn" onclick="Modal.close()">&times;</button>
        </div>
        <form id="checkForm">
            <div class="modal-body">
                <div class="form-group">
                    <label for="checkUserName">이름</label>
                    <input type="text" id="checkUserName" name="userName" placeholder="이름을 입력하세요" required>
                </div>
                <div class="form-group">
                    <label for="checkRole">역할</label>
                    <select id="checkRole" name="role">
                        <option value="USER">일반 사용자</option>
                        <option value="ADMIN">관리자</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="Modal.close()">취소</button>
                <button type="button" class="btn btn-success" onclick="Modal.saveUser()">저장하기</button>
            </div>
        </form>
    </div>
</div>

<!-- Alert 모달 -->
<div th:fragment="alertModal">
    <div class="modal-content alert-modal">
        <div class="modal-body">
            <div class="alert-icon info">!</div>
            <h3 data-modal-title>알림</h3>
            <p data-modal-message>메시지가 표시됩니다.</p>
        </div>
        <div class="modal-footer">
            <button class="btn btn-primary" data-modal-confirm>확인</button>
        </div>
    </div>
</div>

<!-- Confirm 모달 (확인/취소 버튼) -->
<div th:fragment="confirmModal">
    <div class="modal-content confirm-modal">
        <div class="modal-body">
            <h3 data-modal-title>확인</h3>
            <p data-modal-message>진행하시겠습니까?</p>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" data-modal-cancel>취소</button>
            <button class="btn btn-primary" data-modal-confirm>확인</button>
        </div>
    </div>
</div>
